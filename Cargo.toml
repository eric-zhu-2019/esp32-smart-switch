[package]
name = "smart-switch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "ESP32-C3 Mini firmware for a remote relay power switch"
publish = false

[[bin]]
name = "smart-switch"
path = "src/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c3"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[lints.clippy]
mem_forget = "deny"
